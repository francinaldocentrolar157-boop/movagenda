<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002E39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MovAgenda">
<title>MovAgenda — MovDesign</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23002E39'/%3E%3Cpath d='M14 12H50a6 6 0 0 1 6 6V40a6 6 0 0 1-6 6H28L15 58V46a6 6 0 0 1-6-6V18a6 6 0 0 1 5-6z' fill='none' stroke='%23FFAF00' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M26 21l15 10-15 10z' fill='%23FFAF00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Montserrat:wght@800;900&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@200&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#002E39;--bg2:#00252E;--sf:#003E4A;--sf2:#04505F;--bd:rgba(255,255,255,.13);--tx:#E7F3F5;--mu:#8FB3BA;--gold:#FFAF00;--coral:#FF6B6B;--mint:#2EE6A6;--sky:#4CC9F0;--vio:#A78BFA;--pink:#FF7AC6;--ora:#FF9F43;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Poppins',system-ui,-apple-system,sans-serif;color:var(--tx);min-height:100vh;
 background:radial-gradient(900px 500px at 85% -5%,rgba(255,175,0,.10),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(76,201,240,.10),transparent 60%),linear-gradient(180deg,#003343,#002E39 45%,#00252E);background-attachment:fixed;
 padding-bottom:calc(92px + env(safe-area-inset-bottom));font-size:15px;line-height:1.4}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.hide{display:none!important}
.sp{flex:1}
.mu{color:var(--mu)}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(0,46,57,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.wm{font-family:'Playfair Display',serif;font-weight:700;font-size:21px;line-height:1;color:var(--gold);letter-spacing:.2px}
.sl{font-family:'JetBrains Mono',monospace;font-weight:200;font-size:8.5px;letter-spacing:.9px;color:var(--gold);opacity:.85;margin-top:3px;white-space:nowrap}
.today{text-align:right;font-size:12px;color:var(--mu);line-height:1.2}
.today b{display:block;color:var(--tx);font-size:13px}
main{max-width:980px;margin:0 auto;padding:16px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(0,37,46,.96);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;color:var(--mu);font-size:9.8px;font-weight:600}
nav button .ic{font-size:21px;line-height:1.1;filter:grayscale(.7);opacity:.8;transition:.15s}
nav button .f{display:none}
nav button.on{color:var(--gold);background:rgba(255,175,0,.12)}
nav button.on .ic{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
/* ui */
.pg-h{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.pg-h h2{font-family:'Montserrat',sans-serif;font-weight:900;font-size:24px;letter-spacing:-.3px}
.pg-h h2 em{font-style:normal;color:var(--gold)}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid var(--bd);border-radius:var(--r);padding:14px}
.card+.card,.card+.sec,.sec+.card{margin-top:12px}
.sec{margin:20px 0 8px;font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.sec .ct{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:var(--mu);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--bd);background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;transition:.15s;text-decoration:none;color:var(--tx);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#002E39;font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.5);color:#ffb3b3}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.ic-b{padding:7px 9px;font-size:15px;line-height:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--bd);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap}
.chip.on{background:var(--gold);color:#002E39;border-color:var(--gold);font-weight:700}
.chip small{opacity:.75;margin-left:3px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:rgba(76,201,240,.16);color:#9fe3fa;border:1px solid rgba(76,201,240,.35);max-width:100%}
.tag.mu{background:rgba(255,255,255,.07);color:var(--mu);border-color:var(--bd)}
.tag.g{background:rgba(255,175,0,.16);color:#ffd27a;border-color:rgba(255,175,0,.4)}
.tag.m{background:rgba(46,230,166,.15);color:#7ff0c9;border-color:rgba(46,230,166,.4)}
.tag.r{background:rgba(255,107,107,.15);color:#ffa7a7;border-color:rgba(255,107,107,.4)}
.tag.p{background:rgba(255,122,198,.15);color:#ffb0dc;border-color:rgba(255,122,198,.4)}
.tag.v{background:rgba(167,139,250,.16);color:#cdbcff;border-color:rgba(167,139,250,.4)}
.empty{text-align:center;padding:34px 16px;color:var(--mu)}
.empty .big{font-size:42px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{border-radius:var(--r);padding:13px 14px;border:1px solid var(--bd);position:relative;overflow:hidden}
.kpi .l{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:500}
.kpi .v{font-family:'Montserrat',sans-serif;font-weight:900;font-size:22px;margin-top:2px;letter-spacing:-.4px}
.kpi .s{font-size:11px;opacity:.75}
.kpi .e{position:absolute;right:8px;top:6px;font-size:26px;opacity:.5}
.k1{background:linear-gradient(135deg,rgba(255,175,0,.32),rgba(255,175,0,.08))}
.k2{background:linear-gradient(135deg,rgba(46,230,166,.30),rgba(46,230,166,.07))}
.k3{background:linear-gradient(135deg,rgba(255,122,198,.30),rgba(255,122,198,.07))}
.k4{background:linear-gradient(135deg,rgba(76,201,240,.30),rgba(76,201,240,.07))}
.k5{background:linear-gradient(135deg,rgba(167,139,250,.30),rgba(167,139,250,.07))}
.k6{background:linear-gradient(135deg,rgba(255,159,67,.30),rgba(255,159,67,.07))}
.alert{border-radius:var(--r);padding:12px 14px;background:linear-gradient(135deg,rgba(255,122,198,.28),rgba(255,175,0,.20));border:1px solid rgba(255,175,0,.5);margin-bottom:12px}
.alert b{color:var(--gold)}
.alert .it{display:flex;align-items:center;gap:10px;margin-top:8px}
/* avatar */
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;overflow:hidden;background:#fff2}
.av img{width:100%;height:100%;display:block;object-fit:cover}
.av.sq{border-radius:14px;background:#fff;border-color:rgba(255,255,255,.4)}
.av.sq img{object-fit:contain;padding:3px}
.av.noimg{font-weight:700}
/* birthday card */
.pc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.pc.t0{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,175,0,.25),0 8px 30px rgba(255,175,0,.15)}
.pc.t1{border-color:var(--pink)}
.pc .nm{font-weight:700;font-size:16px;cursor:pointer;line-height:1.2}
.pc .sb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12px;color:var(--mu)}
.pc .wh{font-size:12px;margin-top:3px;font-weight:600;color:var(--pink)}
.pc .wh.pa{color:var(--mu);font-weight:500}
.dt{text-align:center;background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:14px;padding:6px 10px;min-width:58px}
.dt b{display:block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:24px;line-height:1;color:var(--gold)}
.dt i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mu)}
.pc .ac{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:10px;border-top:1px dashed var(--bd)}
.chk{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:7px 11px;font-size:13px;font-weight:600;border:1.5px solid;background:transparent}
.chk .bx{width:18px;height:18px;border-radius:6px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:12px;line-height:1;font-weight:900}
.chk.on{background:rgba(46,230,166,.18);color:#5df0bd;border-color:rgba(46,230,166,.7)}
.chk.on .bx{background:#2EE6A6;color:#002E39;border-color:#2EE6A6}
.chk.off{background:rgba(255,107,107,.12);color:#ff9d9d;border-color:rgba(255,107,107,.6)}
.chk.neu{color:var(--mu);border-color:var(--bd)}
.chk.neu.on{background:rgba(76,201,240,.18);color:#8fe0fb;border-color:rgba(76,201,240,.7)}
.chk.neu.on .bx{background:#4CC9F0;color:#002E39;border-color:#4CC9F0}
/* agenda */
.wk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wk .ttl{flex:1;text-align:center;font-weight:700}
.day{margin-top:10px;border-radius:var(--r);border:1px solid var(--bd);background:rgba(255,255,255,.04);overflow:hidden}
.day.td{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,175,0,.18)}
.day.sab{background:rgba(167,139,250,.07)}
.day .dh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,255,255,.05);font-weight:700}
.day.td .dh{background:rgba(255,175,0,.18)}
.day .dh .n{font-family:'Montserrat',sans-serif;font-weight:900;font-size:18px;color:var(--gold)}
.day .dh small{color:var(--mu);font-weight:500}
.it2{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--bd);border-left:4px solid var(--c,#8FB3BA)}
.it2 .tm{min-width:46px;font-weight:700;font-size:13px;color:var(--c,var(--mu))}
.it2 .bd{flex:1;min-width:0;cursor:pointer}
.it2 .t{font-weight:600;font-size:14.5px}
.it2 .t.dn{text-decoration:line-through;opacity:.55}
.it2 .s{font-size:12px;color:var(--mu);margin-top:2px}
.sbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);background:transparent;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;flex:none}
.sbox.on{background:var(--mint);border-color:var(--mint);color:#002E39}
.none{padding:10px 12px;font-size:12.5px;color:var(--mu);border-top:1px solid var(--bd)}
/* demand */
.dm .top2{display:flex;gap:10px;align-items:flex-start}
.dm .ttl{font-weight:700;font-size:15.5px;cursor:pointer;line-height:1.25}
.dm .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.dm.done{opacity:.72}
.dm.done .ttl{text-decoration:line-through}
.steps{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:11px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:99px;transition:width .3s}
.ki{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.08);flex:none}
/* contracts table */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:rgba(255,255,255,.03)}
table.t{border-collapse:separate;border-spacing:0;width:100%;min-width:760px}
table.t th{background:rgba(255,175,0,.16);color:var(--gold);font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;padding:10px 8px;text-align:center;white-space:nowrap;position:sticky;top:0}
table.t td{padding:8px;border-top:1px solid var(--bd);text-align:center;vertical-align:middle}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;z-index:2;background:#00323e}
table.t th:first-child{background:#3d3b1e;z-index:3}
table.t tr.inat td{opacity:.5}
table.t tfoot td{background:rgba(255,175,0,.14);font-weight:800;border-top:2px solid var(--gold);color:#fff}
table.t tfoot td:first-child{background:#3d3b1e}
.ce{display:flex;align-items:center;gap:9px;min-width:190px;cursor:pointer}
.ce b{display:block;line-height:1.2}
.ce small{color:var(--mu);font-size:11px}
.num{width:92px;background:#00252E;border:1.5px solid var(--bd);border-radius:9px;color:var(--tx);padding:6px 7px;text-align:right;font:inherit;font-size:14px}
.num.s{width:58px;text-align:center}
.num:focus{outline:2px solid var(--gold);border-color:var(--gold)}
/* forms/modals */
.in{width:100%;background:#00252E;border:1.5px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;color-scheme:dark}
.in:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea.in{min-height:84px;resize:vertical}
.lbl{font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 5px;letter-spacing:.3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:10px}
.mback{position:fixed;inset:0;background:rgba(0,16,21,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fd .18s}
.modal{background:#00323e;border:1px solid var(--bd);border-radius:22px 22px 0 0;width:100%;max-width:580px;max-height:93dvh;display:flex;flex-direction:column;animation:up .22s ease-out}
.modal .mh{display:flex;align-items:center;padding:14px 18px 8px}
.modal .mh h3{font-family:'Montserrat',sans-serif;font-weight:900;font-size:19px;flex:1}
.modal .x{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:32px;height:32px}
.modal .mb{overflow:auto;padding:4px 18px 14px;-webkit-overflow-scrolling:touch}
.modal .mf{display:flex;gap:8px;align-items:center;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bd)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.avedit{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--bd);background:rgba(255,255,255,.06);font-size:21px;padding:0}
.emojis button.on{border-color:var(--gold);background:rgba(255,175,0,.2)}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}
.swatches button.on{border-color:#fff}
.sw{display:flex;align-items:center;gap:10px;padding:10px 0}
.sw input{width:22px;height:22px;accent-color:var(--gold)}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.warn{background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.45);border-radius:11px;padding:8px 11px;font-size:12.5px;margin-top:8px;color:#d6c9ff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#002E39;font-weight:600;padding:10px 16px;border-radius:12px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;font-size:14px;animation:up .2s}
.toast.err{background:var(--coral);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#002E39;border:0;font-size:32px;font-weight:700;line-height:1;box-shadow:0 8px 24px rgba(255,175,0,.45);z-index:25;display:flex;align-items:center;justify-content:center;padding:0 0 3px}
.fab:active{transform:scale(.93)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 0 10px}
.qa button{border:1.5px solid var(--bd);background:rgba(255,255,255,.06);border-radius:16px;padding:16px 8px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa button span{font-size:30px}
input[type=checkbox]{accent-color:var(--gold)}
/* reports */
.pvw{overflow:hidden;border-radius:12px;background:#dfe8ea;padding:0;position:relative}
.pvi{transform-origin:0 0;width:794px}
#offscreen{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.paper{width:794px;background:#fff;color:#12333b;font-family:'Poppins',sans-serif;padding:0 0 22px;font-size:13px;line-height:1.35}
.paper .ph{background:#002E39;display:flex;align-items:center;padding:20px 32px;gap:14px}
.paper .ph .lg{display:flex;align-items:center;gap:11px}
.paper .ph .wm{font-size:26px}
.paper .ph .sl{font-size:9px}
.paper .ph .tg{margin-left:auto;color:#FFAF00;font-weight:600;letter-spacing:3px;font-size:11px;text-align:right}
.paper .bar2{height:6px;background:linear-gradient(90deg,#FFAF00,#FF7AC6,#4CC9F0)}
.paper .pt{padding:22px 32px 6px}
.paper .pt h1{font-family:'Montserrat',sans-serif;font-weight:900;font-size:30px;color:#002E39;letter-spacing:-.5px;line-height:1.1}
.paper .pt h1 span{color:#e69a00}
.paper .pt p{margin:6px 0 0;color:#5a7a82;font-size:13px}
.paper .st{display:flex;gap:10px;padding:10px 32px 4px;flex-wrap:wrap}
.paper .st div{background:#eef6f8;border-radius:12px;padding:8px 14px;border:1px solid #d6e6ea}
.paper .st b{display:block;font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px;color:#002E39;line-height:1.1}
.paper .st span{font-size:11px;color:#5a7a82}
.paper .st .gd b{color:#0a9f6e}.paper .st .rd b{color:#d83b3b}
.paper table{width:calc(100% - 64px);margin:12px 32px 4px;border-collapse:collapse}
.paper th{background:#002E39;color:#FFAF00;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;padding:9px 8px;text-align:left}
.paper td{padding:8px;border-bottom:1px solid #e1ecef;vertical-align:middle}
.paper tr:nth-child(even) td{background:#f6fafb}
.paper .c{text-align:center}.paper .r{text-align:right}
.paper .dd{font-weight:700;color:#002E39;white-space:nowrap}.paper .dd small{display:block;color:#7a959c;font-weight:500;font-size:10.5px}
.paper .pn{display:flex;align-items:center;gap:9px;font-weight:600;color:#12333b}
.paper .pn small{display:block;font-weight:400;color:#7a959c;font-size:10.5px}
.paper .bg{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:700;font-size:11px;white-space:nowrap}
.paper .bg.ok{background:#d6f7ea;color:#087a54;border:1px solid #7fe0b9}
.paper .bg.no{background:#ffe0e0;color:#c42f2f;border:1px solid #ffa3a3}
.paper .bg.nu{background:#e7eef0;color:#5a7a82;border:1px solid #cfdde1}

<script>
(function(){
'use strict';
/* ============ helpers ============ */
const KEY='movagenda_v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const parse=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const sum=(a,k)=>a.reduce((t,x)=>t+(Number(x[k])||0),0);
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const dim=(y,m)=>new Date(y,m,0).getDate(); // m 1-12
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WDL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fd=s=>{if(!s)return '—';const a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]};
const fdate=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const COLORS=['#FF7AC6','#FFAF00','#2EE6A6','#4CC9F0','#A78BFA','#FF9F43','#FF6B6B','#8FB3BA'];
const EMO_P=['🎂','🎉','🎈','🎁','👤','👩','👨','🧑‍💼','👩‍💼','👨‍💼','🧑‍🔧','👷','💊','🛒','⭐','😀'];
const EMO_C=['🏢','🛋️','💊','🏛️','🏙️','⛽','🏨','🏗️','🍕','🛍️','🏥','🍔','🚗','📈','⭐','🏪'];
const ETYPES={post:{n:'Postagem',e:'📲',c:'#FF7AC6'},visit:{n:'Visita',e:'🚗',c:'#2EE6A6'},meet:{n:'Reunião',e:'🤝',c:'#4CC9F0'},shoot:{n:'Captação',e:'🎬',c:'#FF9F43'},deliver:{n:'Entrega',e:'📦',c:'#A78BFA'},other:{n:'Outro',e:'📌',c:'#8FB3BA'}};
const KINDS={arte:['🎨','Arte'],video:['🎬','Vídeo'],reels:['📱','Reels'],story:['⭕','Story'],carrossel:['🖼️','Carrossel'],foto:['📷','Foto'],drone:['🚁','Drone'],trafego:['📈','Tráfego'],materia:['📰','Matéria'],outro:['📌','Outro']};
const STEPS=[['made','🎨','Feito'],['delivered','📤','Entregue'],['approved','✅','Aprovado'],['posted','📲','Postado']];

/* ============ storage ============ */
let storageOK=true;
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){storageOK=false}
function defaults(){return{v:1,settings:{remindDays:1,remindHour:9,caption:'🎉 Hoje é dia de festa! A equipe {empresa} deseja um feliz aniversário, {nome}! 🎂\n\nQue o seu dia seja cheio de alegria, saúde e muitas conquistas! 🥳💛',lastRemind:''},people:[],events:[],demands:[],contracts:[]}}
function mkContract(company,value,x){return Object.assign({id:uid(),company:company,logo:'',emoji:'🏢',color:'#FFAF00',start:'',payDay:'',value:value,videos:0,arts:0,traffic:false,active:true,end:'',contact:'',notes:'',paid:{}},x||{})}
function seed(){
  const s=defaults();
  s.contracts=[
    mkContract('Centrolar Magazine',3000,{emoji:'🛋️',color:'#FFAF00',notes:'Contrato fixo, expediente até 13h'}),
    mkContract('Grupo Drogaria Popular',2550,{emoji:'💊',color:'#2EE6A6',start:'2026-11-09',videos:20,arts:20,notes:'3 farmácias: Drogaria Popular (Centro Novo), Ideal Farma (Maracaçumé) e Drogaria Popular do Chega Tudo. Plano Premium ampliado.'}),
    mkContract('Câmara Municipal de Centro Novo',1985.73,{emoji:'🏛️',color:'#4CC9F0',notes:'Sextas: live da sessão + matérias, artes e vídeos para o Instagram'}),
    mkContract('Prefeitura',1490,{emoji:'🏙️',color:'#A78BFA',notes:'Edição de vídeos'}),
    mkContract('Grupo Safira',850,{emoji:'⛽',color:'#FF9F43',notes:'Autoposto KS, Chega Tudo Construções, Hotel Safira, Dra. Safira'}),
    mkContract('Kerlly Construções',850,{emoji:'🏗️',color:'#FF6B6B'}),
    mkContract('Pizzaria Sabor do Norte + Tok de Conforto',1000,{emoji:'🍕',color:'#FF7AC6',start:'2026-10-12'})
  ];
  s.events=[{id:uid(),type:'post',title:'Live da sessão + matérias e artes',company:'Câmara Municipal de Centro Novo',date:'2026-11-20',time:'',place:'Câmara Municipal',city:'Centro Novo do Maranhão',repeat:'weekly',notes:'',done:{}}];
  return s;
}
function migrate(o){const d=defaults();const s=Object.assign(d,o);s.settings=Object.assign(d.settings,o.settings||{});['people','events','demands','contracts'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});return s}
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return seed()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não consegui salvar (armazenamento cheio ou bloqueado). Faça um backup em Ajustes.','err')}}

/* ============ date logic ============ */
function occ(p,y){let d=p.day;if(p.month===2&&d===29&&dim(y,2)<29)d=28;return new Date(y,p.month-1,d)}
function nextOcc(p,from){let d=occ(p,from.getFullYear());if(d<from)d=occ(p,from.getFullYear()+1);return d}
function whenLabel(n){return n===0?'🎉 É HOJE!':n===1?'🎈 Amanhã':n>1?'em '+n+' dias':'já passou'}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function eventsOn(date){const s=ymd(date),wd=date.getDay();return S.events.filter(e=>e.date===s||(e.repeat==='weekly'&&parse(e.date)<=date&&parse(e.date).getDay()===wd)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
function payDate(c,y,m){return new Date(y,m-1,Math.min(+c.payDay,dim(y,m)))}
function allCompanies(){const set=new Set();S.contracts.forEach(c=>c.company&&set.add(c.company));S.people.forEach(p=>p.company&&set.add(p.company));S.events.forEach(e=>e.company&&set.add(e.company));S.demands.forEach(e=>e.company&&set.add(e.company));return Array.from(set).sort((a,b)=>a.localeCompare(b,'pt'))}
function demandDone(d){return d.noPost?!!d.steps.delivered:!!d.steps.posted}
function demandSteps(d){return d.noPost?STEPS.filter(s=>s[0]!=='posted'):STEPS}
function demandPct(d){const st=demandSteps(d);return Math.round(st.filter(s=>d.steps[s[0]]).length/st.length*100)}
function sortByDue(a,b){return (a.due||'9999').localeCompare(b.due||'9999')||(b.priority==='alta')-(a.priority==='alta')}

/* ============ ui basics ============ */
function toast(msg,kind){const t=document.createElement('div');t.className='toast'+(kind==='err'?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),kind==='err'?4500:2400)}
function openModal(html,opts){
  opts=opts||{};
  const back=document.createElement('div');back.className='mback';
  back.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(back);document.body.classList.add('noscroll');
  const close=()=>{back.remove();if(!$('.mback'))document.body.classList.remove('noscroll');if(opts.onClose)opts.onClose()};
  back.addEventListener('mousedown',e=>{if(e.target===back)close()});
  $$('[data-close]',back).forEach(b=>b.addEventListener('click',close));
  return {el:back.firstElementChild,close:close};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$$('.mback').pop();if(m){const b=$('[data-close]',m);if(b)b.click();else m.remove()}}});
function confirmBox(title,msg,okLabel){
  return new Promise(res=>{
    const m=openModal('<div class="mh"><h3>'+esc(title)+'</h3></div><div class="mb"><p style="margin:6px 0">'+esc(msg)+'</p></div><div class="mf"><span class="sp"></span><button class="btn ghost" id="cn">Cancelar</button><button class="btn danger" id="ok">'+esc(okLabel||'Excluir')+'</button></div>',{onClose:()=>res(false)});
    $('#cn',m.el).onclick=()=>m.close();
    $('#ok',m.el).onclick=()=>{res(true);m.close()};
  });
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copiado! ✅');return}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok){toast('Copiado! ✅');return}}catch(e){}
  const m=openModal('<div class="mh"><h3>Copie o texto</h3><button class="x" data-close>✕</button></div><div class="mb"><textarea class="in" id="cp" style="min-height:180px">'+esc(t)+'</textarea><div class="hint">Selecione tudo e copie manualmente.</div></div>');
  const ta=$('#cp',m.el);ta.focus();ta.select();
}
function av(o,size,sq){
  size=size||44;
  const col=o.color||'#FFAF00';
  if(o.img)return '<span class="av'+(sq?' sq':'')+'" style="width:'+size+'px;height:'+size+'px;border-color:'+col+'"><img src="'+o.img+'" alt=""></span>';
  return '<span class="av noimg'+(sq?' sq':'')+'" style="width:'+size+'px;height:'+size+'px;border-color:'+col+';background:'+col+'30;font-size:'+Math.round(size*.46)+'px">'+esc(o.emoji||initials(o.label))+'</span>';
}
const avP=(p,s)=>av({img:p.photo,emoji:p.emoji,color:p.color,label:p.name},s,false);
const avC=(c,s)=>av({img:c.logo,emoji:c.emoji,color:c.color,label:c.company},s,true);
function fileToImage(file,o){
  o=o||{};const max=o.max||360,square=o.square!==false,png=!!o.png;
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=rej;
    fr.onload=()=>{const im=new Image();
      im.onerror=rej;
      im.onload=()=>{let sw=im.width,sh=im.height,sx=0,sy=0;
        if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
        const sc=Math.min(1,max/Math.max(sw,sh));const w=Math.round(sw*sc),h=Math.round(sh*sc);
        const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
        if(!png){x.fillStyle='#fff';x.fillRect(0,0,w,h)}
        x.drawImage(im,sx,sy,sw,sh,0,0,w,h);
        res(c.toDataURL(png?'image/png':'image/jpeg',o.q||.85));};
      im.src=fr.result;};
    fr.readAsDataURL(file);
  });
}
/* avatar editor (photo or emoji + color) */
function avEditorHTML(kind){
  const emo=kind==='logo'?EMO_C:EMO_P;
  return '<div class="avedit"><div id="avprev"></div><div style="display:flex;flex-direction:column;gap:7px"><label class="btn sm">📷 '+(kind==='logo'?'Logomarca':'Foto')+'<input type="file" accept="image/*" id="avfile" hidden></label><button type="button" class="btn sm ghost" id="avrm">Remover '+(kind==='logo'?'logo':'foto')+'</button></div></div>'+
   '<div class="lbl">Ícone (aparece quando não tem foto)</div><div class="emojis" id="avemo">'+emo.map(e=>'<button type="button" data-e="'+e+'">'+e+'</button>').join('')+'</div>'+
   '<div class="lbl">Cor</div><div class="swatches" id="avcol">'+COLORS.map(c=>'<button type="button" data-c="'+c+'" style="background:'+c+'"></button>').join('')+'</div>';
}
function mountAv(root,t,kind,labelFn){
  const prev=$('#avprev',root);
  const draw=()=>{
    prev.innerHTML=av({img:t.img,emoji:t.emoji,color:t.color,label:labelFn()},84,kind==='logo');
    $$('#avemo button',root).forEach(b=>b.classList.toggle('on',b.dataset.e===t.emoji));
    $$('#avcol button',root).forEach(b=>b.classList.toggle('on',b.dataset.c===t.color));
  };
  $('#avfile',root).addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{t.img=await fileToImage(f,kind==='logo'?{max:420,square:false,png:true}:{max:360,square:true});draw()}catch(err){toast('Não consegui ler essa imagem','err')}
    e.target.value='';
  });
  $('#avrm',root).onclick=()=>{t.img='';draw()};
  $('#avemo',root).addEventListener('click',e=>{const b=e.target.closest('button');if(b){t.emoji=b.dataset.e;draw()}});
  $('#avcol',root).addEventListener('click',e=>{const b=e.target.closest('button');if(b){t.color=b.dataset.c;draw()}});
  const nm=$('#f_name',root)||$('#f_company',root);if(nm)nm.addEventListener('input',draw);
  draw();
}
const val=(root,id)=>{const e=$('#'+id,root);return e?e.value.trim():''};
const optList=(arr,sel)=>arr.map(a=>'<option value="'+esc(a[0])+'"'+(String(a[0])===String(sel)?' selected':'')+'>'+esc(a[1])+'</option>').join('');

/* ============ state of UI ============ */
const T0=today();
const UI={tab:'inicio',
  bd:{month:'all',year:T0.getFullYear(),company:'',q:'',st:'all',sort:'cal'},
  ag:{ws:mondayOf(T0),types:[]},
  dm:{st:'open',company:'',q:''},
  ct:{view:'ativos'},

function upcomingBdays(limit,from){
  const t=from||today();
  return S.people.map(p=>{const d=nextOcc(p,t);return {p:p,d:d,n:daysBetween(t,d),y:d.getFullYear()}}).filter(o=>o.n<=limit).sort((a,b)=>a.n-b.n||a.p.name.localeCompare(b.p.name));
}

   '<div class="kpi k3"><span class="e">🎂</span><div class="l">Aniversários em '+MONTHS[t.getMonth()]+'</div><div class="v">'+mp.length+'</div><div class="s">'+pend.length+' arte(s) pendente(s)</div></div>'+
   '<div class="kpi k2"><span class="e">✅</span><div class="l">Demandas abertas</div><div class="v">'+openD.length+'</div><div class="s">'+late.length+' atrasada(s)</div></div>'+

  if(!ups.length)h+='<div class="card empty" style="padding:20px">Nenhum aniversário nos próximos 30 dias.</div>';

  /* agenda próximos 7 dias */
  h+='<div class="sec">📅 Agenda dos próximos dias</div>';
  let items=[];
  for(let i=0;i<7;i++){const d=addDays(t,i);eventsOn(d).forEach(e=>items.push({d:d,e:e}))}
  if(!items.length)h+='<div class="card empty" style="padding:20px">Nada marcado nos próximos 7 dias.</div>';
  else h+=items.slice(0,8).map(o=>{const ty=ETYPES[o.e.type]||ETYPES.other;return '<div class="card" style="display:flex;gap:11px;align-items:center;padding:10px 12px;border-left:4px solid '+ty.c+'"><div style="font-size:24px">'+ty.e+'</div><div style="flex:1;min-width:0;cursor:pointer" data-act="evEdit" data-id="'+o.e.id+'"><div style="font-weight:600">'+esc(o.e.title)+'</div><div style="font-size:12px;color:var(--mu)">'+(sameDay(o.d,t)?'Hoje':WD[o.d.getDay()]+' '+pad(o.d.getDate())+'/'+pad(o.d.getMonth()+1))+(o.e.time?' · '+esc(o.e.time):'')+(o.e.company?' · '+esc(o.e.company):'')+(o.e.city?' · '+esc(o.e.city):'')+'</div></div></div>'}).join('');
  /* demandas */
  h+='<div class="sec">✅ Demandas em andamento</div>';
  const dd=openD.slice().sort(sortByDue).slice(0,5);
  if(!dd.length)h+='<div class="card empty" style="padding:20px">Nenhuma demanda aberta. 🎉</div>';
  else h+=dd.map(d=>{const k=KINDS[d.kind]||KINDS.outro;const dl=dueInfo(d);return '<div class="card" style="padding:10px 12px;cursor:pointer" data-act="goDm"><div style="display:flex;gap:10px;align-items:center"><div class="ki">'+k[0]+'</div><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(d.title)+'</div><div style="font-size:12px;color:var(--mu)">'+esc(d.company||'—')+' · '+dl.text+'</div></div><div style="font-weight:800;color:var(--mint)">'+demandPct(d)+'%</div></div></div>'}).join('');
  /* pagamentos */
  const key=ym(t);
  const pays=act.filter(c=>c.payDay&&!(c.paid||{})[key]).map(c=>({c:c,d:payDate(c,t.getFullYear(),t.getMonth()+1)})).sort((a,b)=>a.d-b.d);
  h+='<div class="sec">💰 Pagamentos a receber em '+MONTHS[t.getMonth()]+'</div>';
  if(!pays.length)h+='<div class="card empty" style="padding:20px">'+(act.some(c=>c.payDay)?'Tudo recebido neste mês! 🙌':'Defina o dia de pagamento nos contratos para ver aqui.')+'</div>';
  else h+=pays.map(o=>{const n=daysBetween(t,o.d);return '<div class="card" style="display:flex;align-items:center;gap:12px;padding:10px 12px">'+avC(o.c,40)+'<div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(o.c.company)+'</div><div style="font-size:12px;color:'+(n<0?'#ffa7a7':'var(--mu)')+'">Dia '+pad(o.d.getDate())+' · '+(n<0?'venceu há '+(-n)+' dia(s)':n===0?'hoje':'em '+n+' dia(s)')+'</div></div><div style="font-weight:800;color:var(--gold)">'+brl(o.c.value)+'</div><button class="btn sm" data-act="paid" data-id="'+o.c.id+'">Recebi ✓</button></div>'}).join('');
  return h;
}
function dueInfo(d){
  if(!d.due)return {text:'sem prazo',cls:'mu',late:false};
  const n=daysBetween(today(),parse(d.due));
  if(demandDone(d))return {text:'prazo '+fd(d.due),cls:'mu',late:false};
  if(n<0)return {text:'atrasada '+(-n)+'d',cls:'r',late:true};
  if(n===0)return {text:'entrega hoje',cls:'g',late:false};
  if(n===1)return {text:'entrega amanhã',cls:'g',late:false};
  return {text:'prazo '+fd(d.due).slice(0,5),cls:'mu',late:false};
}

function contractTotals(){
  const act=S.contracts.filter(c=>c.active),key=ym(today());
  const rec=act.filter(c=>(c.paid||{})[key]);
  return {n:act.length,val:sum(act,'value'),vid:sum(act,'videos'),art:sum(act,'arts'),tr:act.filter(c=>c.traffic).length,recN:rec.length,rec:sum(rec,'value')};
}
function monthsBetween(a,b){const d1=parse(a),d2=parse(b);let m=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth());if(d2.getDate()<d1.getDate())m--;return Math.max(0,m)}
function durText(a,b){
  if(!a||!b)return '—';const days=daysBetween(parse(a),parse(b));if(days<0)return '—';
  const m=monthsBetween(a,b),y=Math.floor(m/12),mm=m%12,parts=[];
  if(y)parts.push(y+(y>1?' anos':' ano'));if(mm)parts.push(mm+(mm>1?' meses':' mês'));
  if(!parts.length)parts.push(days+(days===1?' dia':' dias'));return parts.join(' e ');
}
function estTotal(c){if(!c.start||!c.end)return 0;const days=daysBetween(parse(c.start),parse(c.end));if(days<0)return 0;return Math.round((Number(c.value)||0)*(days/30.4375)*100)/100}
function histTotals(his){const n=his.length;return {n:n,est:his.reduce((t,c)=>t+estTotal(c),0),avg:n?sum(his,'value')/n:0}}

}

async function renderCanvas(){
  if(!window.html2canvas)throw new Error('lib');
  const host=$('#offscreen');host.innerHTML='<div class="'+paperCls()+'">'+reportHTML()+'</div>';
  try{await document.fonts.ready}catch(e){}
  await Promise.all($$('img',host).map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  const root=host.firstElementChild,base=root.getBoundingClientRect().top;
  const tops=$$('tr,.mc,.cc,.sub,.ft,.msgb',root).map(e=>Math.round((e.getBoundingClientRect().top-base)*2)).filter(v=>v>0);
  const c=await html2canvas(root,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
  c._tops=tops;host.innerHTML='';return c;
}
const coarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
async function deliver(blob,name,type,noShare){
  const file=new File([blob],name,{type:type});
  if(coarse&&!noShare&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return true}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Arquivo gerado: '+name);return true;
}
function pdfPages(c){
  const pxmm=c.width/210,tops=(c._tops||[]).slice().sort((a,b)=>a-b),pages=[];
  let y0=0;
  while(y0<c.height-2){
    const avail=(y0===0?297:285)*pxmm;let y1=y0+avail;
    if(y1>=c.height)y1=c.height;
    else{let cut=0;for(const b of tops){if(b>y0+avail*.35&&b<=y1)cut=b}if(cut)y1=cut}
    pages.push([y0,y1]);y0=y1;
  }
  return pages;
}
async function exportPDF(){
  toast('Gerando PDF…');
  try{
    const c=await renderCanvas();
    if(!window.jspdf)throw new Error('lib');
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    const pxmm=c.width/210,ih=c.height/pxmm,img=c.toDataURL('image/jpeg',.95);
    pdfPages(c).forEach((pg,i)=>{
      if(i>0)pdf.addPage();
      const off=i===0?0:6;
      pdf.addImage(img,'JPEG',0,off-pg[0]/pxmm,210,ih,'rep');
      pdf.setFillColor(255,255,255);
      pdf.rect(0,off+(pg[1]-pg[0])/pxmm,210,297,'F');
      if(off)pdf.rect(0,0,210,off,'F');
    });
    await deliver(pdf.output('blob'),reportName()+'.pdf','application/pdf');
  }catch(e){toast('Não consegui gerar o PDF. Verifique a internet (bibliotecas) e tente de novo.','err')}
}

const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsFold=l=>{const a=Array.from(l);if(a.length<=60)return l;const out=[];for(let i=0;i<a.length;i+=60)out.push(a.slice(i,i+60).join(''));return out.join('\r\n ')};
const icsD=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
function buildICS(kind){
  const t=today(),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MovDesign//MovAgenda//PT','CALSCALE:GREGORIAN','X-WR-CALNAME:MovAgenda '+(kind==='b'?'Aniversários':'Agenda')],stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const rd=S.settings.remindDays,rh=S.settings.remindHour;
  if(kind==='b'){
    S.people.forEach(p=>{
      const d=nextOcc(p,t);
      L.push('BEGIN:VEVENT','UID:b-'+p.id+'@movagenda','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+icsD(d),'DTEND;VALUE=DATE:'+icsD(addDays(d,1)),'RRULE:FREQ=YEARLY','SUMMARY:'+icsEsc('🎂 '+p.name+(p.company?' ('+p.company+')':'')),'DESCRIPTION:'+icsEsc('Aniversário de '+p.name+(p.company?' - '+p.company:'')+'. Fazer a arte e postar!'),'TRANSP:TRANSPARENT');
      if(rd>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Amanhã: aniversário de '+p.name),'TRIGGER:-PT'+(rd*24-rh)+'H','END:VALARM');
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Hoje: aniversário de '+p.name),'TRIGGER:PT8H','END:VALARM','END:VEVENT');
    });
  }else{
    S.events.forEach(e=>{
      const base=parse(e.date);
      L.push('BEGIN:VEVENT','UID:e-'+e.id+'@movagenda','DTSTAMP:'+stamp);
      if(e.time){const hh=e.time.replace(':','')+'00',eh=pad((+e.time.slice(0,2)+1)%24)+e.time.slice(3,5)+'00';L.push('DTSTART:'+icsD(base)+'T'+hh,'DTEND:'+icsD(base)+'T'+eh)}
      else L.push('DTSTART;VALUE=DATE:'+icsD(base),'DTEND;VALUE=DATE:'+icsD(addDays(base,1)));
      if(e.repeat==='weekly')L.push('RRULE:FREQ=WEEKLY');
      L.push('SUMMARY:'+icsEsc((ETYPES[e.type]||ETYPES.other).e+' '+e.title+(e.company?' — '+e.company:'')),'LOCATION:'+icsEsc([e.place,e.city].filter(Boolean).join(', ')),'DESCRIPTION:'+icsEsc(e.notes||''));
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title),'TRIGGER:'+(e.time?'-PT1H':'-PT15H'),'END:VALARM','END:VEVENT');
    });
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n');
}
async function exportICS(kind){
  const n=kind==='b'?S.people.length:S.events.length;
  if(!n){toast('Não há '+(kind==='b'?'aniversariantes':'compromissos')+' para exportar','err');return}
  await deliver(new Blob([buildICS(kind)],{type:'text/calendar'}),kind==='b'?'MovAgenda-aniversarios.ics':'MovAgenda-agenda.ics','text/calendar',true);

  else if(el.id==='rpi'){UI.rp.incl=el.value;rerender()}
  else if(el.dataset&&el.dataset.f&&el.type==='date'){dateChange(el)}
  else if(el.id==='s_days'){S.settings.remindDays=+el.value;save();toast('Salvo ✅')}
  else if(el.id==='s_hour'){S.settings.remindHour=+el.value;save();toast('Salvo ✅')}
  else if(el.id==='bkfile'){const f=el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>applyBackup(String(fr.result));fr.readAsText(f);el.value=''}
});
/* keep search input focused while list re-renders */
function partial(id){
  const pos=($('#'+id)||{}).selectionStart;
  rerender();
  const e=$('#'+id);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}
}

/* ============ render ============ */
function renderNav(){
  $('#nav').innerHTML=TABS.map(t=>'<button class="'+(UI.tab===t[0]?'on':'')+'" data-act="nav" data-t="'+t[0]+'"><span class="ic">'+t[1]+'</span><span class="s">'+t[2]+'</span><span class="f">'+t[3]+'</span></button>').join('');
}
function render(){
  const dl=$('#dl-co');dl.innerHTML=allCompanies().map(c=>'<option value="'+esc(c)+'"></option>').join('');
  const t=today();
  $('#todayBox').innerHTML='<b>'+WDL[t.getDay()]+'</b>'+pad(t.getDate())+' de '+MONTHS[t.getMonth()].toLowerCase();
  renderNav();
  const v={inicio:viewHome,aniversarios:viewBday,agenda:viewAgenda,demandas:viewDemands,contratos:viewContracts,relatorios:viewReports,ajustes:viewSettings}[UI.tab]||viewHome;
  $('#view').innerHTML=v();
  $('#fab').classList.toggle('hide',['relatorios','ajustes'].indexOf(UI.tab)>=0);
  if(UI.tab==='relatorios')fitPaper();
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
function go(tab){
  if(!TABS.some(t=>t[0]===tab))tab='inicio';
  UI.tab=tab;if(location.hash!=='#'+tab){try{history.replaceState(null,'','#'+tab)}catch(e){location.hash=tab}}
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==UI.tab&&TABS.some(t=>t[0]===h)){UI.tab=h;render();window.scrollTo(0,0)}});
window.addEventListener('resize',()=>{if(UI.tab==='relatorios')fitPaper()});

/* ============ reminders on open ============ */
function checkReminders(){
  const t=today(),items=upcomingBdays(S.settings.remindDays,t);
  if(!items.length||S.settings.lastRemind===ymd(t))return;
  S.settings.lastRemind=ymd(t);save();
  const m=openModal('<div class="mh"><h3>🔔 Lembrete de aniversário</h3><button class="x" data-close>✕</button></div><div class="mb">'+items.map(o=>'<div class="card" style="display:flex;align-items:center;gap:12px;padding:10px 12px;margin-top:8px">'+avP(o.p,48)+'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(o.p.name)+'</div><div style="font-size:12.5px;color:var(--mu)">'+(o.n===0?'🎉 Hoje':'🎈 Amanhã')+(o.p.company?' · '+esc(o.p.company):'')+'</div></div><button class="btn sm" data-cap="'+o.p.id+'">💬 Legenda</button></div>').join('')+'<div class="hint" style="margin-top:12px">Já deixou a arte pronta? Marque em Aniversários.</div></div><div class="mf"><span class="sp"></span><button class="btn ghost" data-close>Fechar</button><button class="btn gold" id="gb">Ver aniversários</button></div>');
  m.el.addEventListener('click',e=>{const b=e.target.closest('[data-cap]');if(b){const p=S.people.find(x=>x.id===b.dataset.cap);if(p)copyText(captionFor(p))}});
  $('#gb',m.el).onclick=()=>{m.close();UI.bd.month='all';go('aniversarios')};
}

/* ============ start ============ */
(function init(){
  const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))UI.tab=h;
  render();
  setTimeout(checkReminders,400);
  window.__MA={get S(){return S},set S(v){S=v},render:render,go:go};
})();
})();
</script>
</body>
</html>
